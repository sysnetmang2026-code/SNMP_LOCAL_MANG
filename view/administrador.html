<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gestión Intuitiva — Panel de Red (UI Demo)</title>
  <!--
    Opción A (recomendada para tu práctica):
    - Este archivo incluye el CSS dentro de <style> para que funcione tal cual.

    Opción B (CSS separado):
    - Copia todo lo que hay dentro de <style> a un archivo styles.css
    - Reemplaza el bloque <style> por: <link rel="stylesheet" href="styles.css">
  -->
  <style>
    :root{
      --bg:#0b1020;           /* fondo general */
      --surface:#121833;      /* paneles/superficies */
      --text:#e9eef8;         /* texto principal */
      --muted:#aab4cf;        /* texto secundario */
      --brand:#5b8cff;        /* color principal */
      --brand-2:#22d3ee;      /* acento */
      --ring:#7aa2ff;         /* borde de foco */
      --border:rgba(255,255,255,.10);
      --shadow:0 12px 30px rgba(0,0,0,.35);
      --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font:500 16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(60% 40% at 10% -10%, rgba(34,211,238,.15), transparent 35%),
        radial-gradient(50% 35% at 90% 0%, rgba(91,140,255,.13), transparent 35%),
        var(--bg);
    }

    /* Encabezado */
    header{
      position:sticky;top:0;z-index:10;
      background:linear-gradient(180deg, #0f2747, #0b1c33);
      border-bottom:1px solid var(--border);
      box-shadow:var(--shadow);
      padding:18px 20px;
      text-align:center;
      font-weight:800; font-size: clamp(20px, 2.4vw, 28px);
      letter-spacing:.3px;
    }

    /* Lienzo principal */
    .wrap{max-width:1100px;margin:40px auto;padding:0 20px}

    /* Cinta superior con botón Reiniciar */
    .top-actions{display:flex;justify-content:center;margin-bottom:26px}
    .btn-rect{
      display:inline-flex;align-items:center;gap:10px;
      padding:12px 16px;border-radius:12px;border:1px solid var(--border);
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.03));
      color:var(--text);cursor:pointer;box-shadow:var(--shadow);
      transition:transform .18s ease, background .18s ease;
    }
    .btn-rect:hover{transform:translateY(-2px);background:rgba(255,255,255,.07)}
    .btn-rect:focus-visible{outline:3px solid var(--ring);outline-offset:2px}

    /* Contenedor de botones redondos */
    .grid{
      display:grid;gap:28px;
      grid-template-columns:repeat(4, minmax(180px, 1fr));
      justify-items:center;
    }
    @media (max-width:980px){.grid{grid-template-columns:repeat(2, minmax(180px,1fr))}}
    @media (max-width:520px){.grid{grid-template-columns:1fr}}

    /* Botones redondos con tooltip */
    .bubble{
      --size:168px; position:relative;
      width:var(--size);height:var(--size);border-radius:50%;
      display:grid;place-items:center;text-align:center;cursor:pointer;
      color:var(--text);padding:18px;
      border:1px solid var(--border);
      background:
        radial-gradient(120% 120% at 30% 20%, rgba(91,140,255,.25), transparent 55%),
        radial-gradient(120% 120% at 70% 90%, rgba(34,211,238,.18), transparent 55%),
        linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      box-shadow:var(--shadow);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .bubble:hover{ transform:translateY(-4px); border-color:rgba(123,162,255,.55); box-shadow:0 16px 34px rgba(0,0,0,.45); }
    .bubble:focus-visible{ outline:4px solid var(--ring); outline-offset:4px }

    .bubble .label{ font-weight:700; font-size:16px }
    .bubble svg{ width:28px; height:28px; opacity:.92; margin-bottom:8px }

    /* Tooltip */
    .tooltip{
      position:absolute; left:50%; bottom:calc(100% + 12px); transform:translateX(-50%);
      width:min(260px, 86vw); padding:10px 12px; border-radius:12px;
      background:rgba(8,12,24,.92); color:var(--text); font-size:14px; line-height:1.35;
      border:1px solid var(--border); box-shadow:var(--shadow);
      opacity:0; visibility:hidden; transition:opacity .18s ease, transform .18s ease, visibility .18s ease;
    }
    .tooltip::after{ content:""; position:absolute; top:100%; left:50%; transform:translateX(-50%);
      border:8px solid transparent; border-top-color:rgba(8,12,24,.92) }
    .bubble:hover .tooltip{ opacity:1; visibility:visible; transform:translate(-50%, -4px) }

    /* Pie */
    footer{margin:32px 0 10px;color:var(--muted);font-size:13px;text-align:center}
  </style>
</head>
<body>
  <header>Gestión Intuitiva</header>

  <main class="wrap">
    <div class="top-actions">
      <button class="btn-rect" aria-label="Reiniciar router (demo)">
        <!-- ícono recargar -->
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7" stroke="currentColor" stroke-width="2"/><path d="M3 3v6h6" stroke="currentColor" stroke-width="2"/></svg>
        <span>Reiniciar</span>
      </button>
    </div>

    <section class="grid" aria-label="Funciones principales">
      <!-- Escaneo de IP -->
      <button class="bubble" aria-describedby="tip-ip">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 5h18v14H3z" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="12" r="2" stroke="currentColor" stroke-width="2"/><path d="M12 12h7" stroke="currentColor" stroke-width="2"/></svg>
        <div class="label">Escaneo de IP</div>
        <div class="tooltip" id="tip-ip">Dirección única de cada dispositivo conectado a tu red.</div>
      </button>

      <!-- Escaneo de MAC -->
      <button class="bubble" aria-describedby="tip-mac">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2" stroke="currentColor" stroke-width="2"/><path d="M7 10h10M7 14h6" stroke="currentColor" stroke-width="2"/></svg>
        <div class="label">Escaneo de MAC</div>
        <div class="tooltip" id="tip-mac">Conoce qué modelo o fabricante del equipo está conectado a tu red.</div>
      </button>

      <!-- Ocultar Wi-Fi -->
      <button class="bubble" aria-describedby="tip-hide">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M1.5 12s3.5-7 10.5-7 10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z" stroke="currentColor" stroke-width="2"/><path d="M14.5 12a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0Z" stroke="currentColor" stroke-width="2"/></svg>
        <div class="label">Ocultar Wi‑Fi</div>
        <div class="tooltip" id="tip-hide">Oculta tu SSID para reducir la visibilidad frente a intrusos.</div>
      </button>

      <!-- Velocidad de Internet -->
      <button class="bubble" aria-describedby="tip-speed">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 20a8 8 0 1 1 16 0" stroke="currentColor" stroke-width="2"/><path d="M12 12l5 3" stroke="currentColor" stroke-width="2"/></svg>
        <div class="label">Velocidad de Internet</div>
        <div class="tooltip" id="tip-speed">Permite visualizar las velocidades actuales de tu conexión.</div>
      </button>
    </section>

    <footer>Demo visual — los botones muestran descripción al pasar el cursor.</footer>
  </main>
</body>
</html>
